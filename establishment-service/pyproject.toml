[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mario-establishment-service"
version = "0.2.0"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.0,<4",
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = ["ruff>=0.6,<1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"] # Flask route decorators intentionally use runtime declarations.
